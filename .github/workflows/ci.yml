# AQAOS 平台 CI（T-E01-04）。
# PR 必跑：lint / typecheck / unit / build / dashboard / e2e（chromium）/ migration check（T-E01-07）。
# 门禁：任一 job 红则禁止合并。目标流水线时长 < 10 分钟。

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / typecheck / unit / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & regression tests
        run: npm run test:unit
      - name: Build TypeScript workspaces
        run: npm run build

  dashboard:
    name: dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck dashboard
        run: npm run typecheck --workspace @aqaos/dashboard
      - name: Build Next.js dashboard
        run: npm run build --workspace @aqaos/dashboard

  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E against the demo target
        run: npm run test:e2e
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  migrate:
    name: migration check (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aqaos
          POSTGRES_PASSWORD: aqaos
          POSTGRES_DB: aqaos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqaos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AQAOS_TEST_DATABASE_URL: postgres://aqaos:aqaos@localhost:5432/aqaos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Migration lifecycle test (up → assert → down → up)
        run: npm run test:db
